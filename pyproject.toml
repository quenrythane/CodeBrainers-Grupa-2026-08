[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_level = "INFO"
log_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

addopts = "-vs --html=reports/report.html --self-contained-html"

markers = [
    "test_imienia: testy imion",
    "wip: testy w trakcie tworzenia",
    "logging: testy z logami",
    "api_login: testy logowania do api",
    "get_employees: testy pobierania pracowników",
    "create_employee: testy tworzenia pracowników",
    "create_employee_v2: testy tworzenia pracowników z API clientem",
    "create_employee_v2_parametrize: testy tworzenia pracowników z parametrami i API clientem",
    "api_test: testy api",
    "site_title: testy tytułu strony",
    "logowanie_ui: testy logowania do ui",
    "test_ui: testy ui",
    "logowanie_ui_v2: testy logowania do ui v2",
    "dodaj_pracownika: test dodawania pracownika",
    
]