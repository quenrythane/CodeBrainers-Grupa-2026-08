[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
log_level = "INFO"
log_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

markers = [
    "test_imienia: testy imion",
    "wip: testy w trakcie tworzenia",
    "logging: testy z logami",
]